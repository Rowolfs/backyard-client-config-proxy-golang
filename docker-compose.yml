services:
  backyard-client-config-proxy:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: backyard-client-config-proxy

    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "127.0.0.1:8080:8080"

    networks:
      - remnawave-network
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
networks:
  remnawave-network:
    external: true
    name: remnawave-network
